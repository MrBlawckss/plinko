<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Plinko</title>
<style>
  /* ============================================================
     DESIGN TOKENS — change these to re-skin the whole game
     ============================================================ */
  :root{
    --bg-deep:      #0B0714;
    --bg-panel:     #150E24;
    --bg-panel-2:   #1D1330;
    --line:         #33234D;
    --pink:         #FF2E88;
    --cyan:         #29F1E0;
    --gold:         #FFC145;
    --text:         #F2EAFB;
    --text-dim:     #9186ad;
    --good:         #57F29A;
    --bad:          #FF5C5C;
    --font-display: "Arial Black", "Segoe UI Black", system-ui, sans-serif;
    --font-mono:    "Consolas", "Courier New", monospace;
    --font-body:    "Segoe UI", system-ui, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 50% -10%, #241639 0%, var(--bg-deep) 55%);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
  }

  /* ---------- top bar ---------- */
  #topbar{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:12px 22px;
    background:linear-gradient(180deg, var(--bg-panel) 0%, rgba(21,14,36,0.4) 100%);
    border-bottom:1px solid var(--line);
    position:relative; z-index:5;
  }
  #logo{
    font-family:var(--font-display);
    letter-spacing:2px;
    font-size:20px;
    background:linear-gradient(90deg, var(--pink), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(255,46,136,0.25);
    justify-self:start;
  }
  #logo span{ font-size:14px; display:block; letter-spacing:4px; color:var(--text-dim); -webkit-text-fill-color:var(--text-dim); }

  #money-wrap{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    padding:8px 16px; border-radius:10px;
    box-shadow: inset 0 0 12px rgba(255,193,69,0.06);
    justify-self:center;
  }
  #money-label{ font-size:11px; letter-spacing:2px; color:var(--text-dim); }
  #money{
    font-family:var(--font-mono); font-weight:bold; font-size:22px;
    color:var(--gold); text-shadow:0 0 12px rgba(255,193,69,0.5);
    min-width:130px; text-align:right;
  }

  #sidebar-toggle{
    font-family:var(--font-body); font-weight:600; font-size:13px;
    letter-spacing:1px;
    background:var(--bg-panel-2); color:var(--text);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 16px; cursor:pointer;
    display:flex; align-items:center; gap:8px;
    transition:border-color .15s, transform .1s;
    justify-self:end;
  }
  #sidebar-toggle:hover{ border-color:var(--cyan); }
  #sidebar-toggle:active{ transform:scale(0.97); }

  /* ---------- main stage ---------- */
  #stage{
    position:relative;
    height:calc(100vh - 60px);
    display:flex; align-items:center; justify-content:center;
    padding:8px;
  }
  #board-wrap{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    height:100%;
    width:100%;
    justify-content:center;
  }
  canvas#board{
    background:radial-gradient(ellipse at 50% 0%, #1a1030 0%, #0c0716 80%);
    border-radius:16px;
    border:1px solid var(--line);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 20px 60px rgba(0,0,0,0.6);
    flex:0 0 auto;
    max-width: 98vw;
    max-height: calc(100vh - 76px);
  }

  /* ---------- controls pinned to left middle ---------- */
  #controls{
    position:absolute;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    display:flex; flex-direction:column; align-items:stretch; gap:12px;
    background:rgba(21, 14, 36, 0.85);
    padding:16px;
    border-radius:16px;
    border:1px solid var(--line);
    backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  #drop-btn{
    font-family:var(--font-display); letter-spacing:1px;
    font-size:16px;
    color:#1a0e08;
    background:linear-gradient(180deg, var(--gold), #e8971f);
    border:none; border-radius:12px;
    padding:14px 24px;
    cursor:pointer;
    box-shadow:0 6px 0 #8a5e12, 0 8px 20px rgba(255,193,69,0.25);
    transition:transform .08s, box-shadow .08s;
  }
  #drop-btn:hover{ filter:brightness(1.08); }
  #drop-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #8a5e12; }
  #drop-btn:disabled{
    background:#4a4458; color:#8a8298; cursor:not-allowed;
    box-shadow:0 6px 0 #2c2836;
  }
  #drop-cost, .btn-sublabel{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); display:block; margin-top:2px;}

  /* ---------- auto drop toggle ---------- */
  #autodrop-btn{
    font-family:var(--font-body); font-weight:700; font-size:12px;
    letter-spacing:1px;
    background:var(--bg-panel-2); color:var(--text-dim);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    transition:all .15s;
  }
  #autodrop-btn.active{
    background:rgba(41,241,224,0.1);
    color:var(--cyan);
    border-color:var(--cyan);
    box-shadow:0 0 10px rgba(41,241,224,0.2);
  }

  /* ---------- bottom left cash button ---------- */
  #add-cash-btn{
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:10;
    font-family:var(--font-display); letter-spacing:1px;
    font-size:14px;
    color:#081a14;
    background:linear-gradient(180deg, var(--good), #2ec470);
    border:none; border-radius:12px;
    padding:12px 20px;
    cursor:pointer;
    box-shadow:0 5px 0 #1e7a46, 0 8px 20px rgba(87,242,154,0.3);
    transition:transform .08s, box-shadow .08s, filter .1s;
    display:none;
  }
  #add-cash-btn:hover{ filter:brightness(1.08); }
  #add-cash-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #1e7a46; }

  #ball-count-badge{
    font-family:var(--font-mono); font-size:13px; color:var(--cyan);
    background:var(--bg-panel-2); border:1px solid var(--line);
    padding:8px 14px; border-radius:10px;
    text-align:center;
  }

  /* ---------- sidebar ---------- */
  #sidebar{
    position:fixed; top:0; right:0; height:100vh; width:340px;
    background:var(--bg-panel);
    border-left:1px solid var(--line);
    transform:translateX(100%);
    transition:transform .25s ease;
    z-index:20;
    display:flex; flex-direction:column;
    box-shadow:-30px 0 60px rgba(0,0,0,0.4);
  }
  #sidebar.open{ transform:translateX(0); }

  #sidebar-header{
    padding:18px 20px 12px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  #sidebar-header h2{
    margin:0; font-family:var(--font-display); font-size:16px; letter-spacing:1px;
  }
  #sidebar-close{
    background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer;
    line-height:1;
  }
  #sidebar-close:hover{ color:var(--pink); }

  #tabs{ display:flex; border-bottom:1px solid var(--line); }
  .tab-btn{
    flex:1; padding:12px 0; background:none; border:none; cursor:pointer;
    color:var(--text-dim); font-family:var(--font-body); font-weight:600; font-size:13px;
    letter-spacing:0.5px;
    border-bottom:2px solid transparent;
  }
  .tab-btn.active{ color:var(--cyan); border-bottom-color:var(--cyan); }

  #sidebar-content{ flex:1; overflow-y:auto; padding:16px 18px; }
  #sidebar-content::-webkit-scrollbar{ width:6px; }
  #sidebar-content::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
  }
  .card-top{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .card-icon{ font-size:22px; }
  .card-name{ font-weight:700; font-size:14px; }
  .card-level{
    margin-left:auto; font-family:var(--font-mono); font-size:11px;
    color:var(--text-dim); background:var(--bg-deep);
    padding:2px 8px; border-radius:6px; border:1px solid var(--line);
  }
  .card-desc{ font-size:12.5px; color:var(--text-dim); line-height:1.4; margin-bottom:10px; }
  .card-bottom{ display:flex; align-items:center; justify-content:space-between; }
  .card-effect{ font-size:11.5px; color:var(--cyan); font-family:var(--font-mono); }

  .buy-btn{
    font-family:var(--font-body); font-weight:700; font-size:12.5px;
    padding:8px 14px; border-radius:8px; border:none; cursor:pointer;
    background:linear-gradient(180deg, var(--pink), #c11762); color:white;
    transition:filter .1s, transform .08s;
  }
  .buy-btn:hover{ filter:brightness(1.1); }
  .buy-btn:active{ transform:scale(0.96); }
  .buy-btn:disabled{ background:#3a3450; color:#8a8298; cursor:not-allowed; }
  .buy-btn.maxed{ background:var(--bg-deep); color:var(--good); border:1px solid var(--good); }
  .buy-btn.equipped{ background:var(--bg-deep); color:var(--good); border:1px solid var(--good); cursor:default; }

  .skin-row{
    display:flex; align-items:center; gap:12px;
  }
  .skin-swatch{
    width:34px; height:34px; border-radius:50%;
    box-shadow:0 0 12px rgba(255,255,255,0.15), inset 0 -4px 6px rgba(0,0,0,0.25);
    flex:none;
  }
  .skin-info{ flex:1; }
  .skin-name{ font-weight:700; font-size:13.5px; }
  .skin-price{ font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); }

  #sidebar-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.4);
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:15;
  }
  #sidebar-backdrop.open{ opacity:1; pointer-events:auto; }

  /* ---------- cheat password modal ---------- */
  #cheat-modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:30;
  }
  #cheat-modal-backdrop.open{ opacity:1; pointer-events:auto; }
  #cheat-modal{
    position:fixed; top:50%; left:50%;
    transform:translate(-50%, -48%);
    width:min(320px, 88vw);
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    z-index:31;
    opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  #cheat-modal.open{ opacity:1; pointer-events:auto; transform:translate(-50%, -50%); }
  #cheat-modal h3{ margin:0 0 6px; font-family:var(--font-display); font-size:16px; letter-spacing:1px; }
  #cheat-modal p{ margin:0 0 14px; font-size:12.5px; color:var(--text-dim); }
  #cheat-password-input{
    width:100%; box-sizing:border-box;
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:10px 12px; font-size:14px; font-family:var(--font-mono);
  }
  #cheat-password-input:focus{ outline:none; border-color:var(--cyan); }
  #cheat-modal-error{ color:var(--bad); font-size:11.5px; min-height:16px; margin-top:8px; }
  #cheat-modal-buttons{ display:flex; gap:10px; margin-top:6px; }
  #cheat-modal-buttons button{
    flex:1; font-family:var(--font-body); font-weight:700; font-size:12.5px;
    padding:10px; border-radius:8px; border:none; cursor:pointer;
  }
  #cheat-cancel-btn{ background:var(--bg-panel-2); color:var(--text-dim); border:1px solid var(--line) !important; }
  #cheat-submit-btn{ background:linear-gradient(180deg, var(--pink), #c11762); color:white; }

  /* ---------- cheat panel (inside sidebar, once unlocked) ---------- */
  .cheat-locked-msg{
    text-align:center; color:var(--text-dim); font-size:13px;
    padding:30px 10px; line-height:1.5;
  }
  .cheat-section-title{
    font-family:var(--font-display); font-size:12px; letter-spacing:1px;
    color:var(--cyan); margin:0 0 10px;
  }
  .cheat-money-row{ display:flex; gap:8px; margin-bottom:10px; }
  .cheat-money-row input{
    flex:1; min-width:0; box-sizing:border-box;
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:9px 10px; font-size:13px; font-family:var(--font-mono);
  }
  .cheat-money-row input:focus{ outline:none; border-color:var(--cyan); }
  .cheat-quick-buttons{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .cheat-quick-buttons button, .cheat-money-row button{
    font-family:var(--font-body); font-weight:700; font-size:12px;
    padding:9px 12px; border-radius:8px; border:none; cursor:pointer;
    background:linear-gradient(180deg, var(--good), #2ec470); color:#081a14;
  }
  .cheat-upgrade-row{
    display:flex; align-items:center; gap:8px;
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:8px;
  }
  .cheat-upgrade-row .cheat-upgrade-name{ flex:1; font-size:12.5px; font-weight:600; }
  .cheat-upgrade-row .cheat-upgrade-level{
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
  }
  .cheat-upgrade-row button{
    font-family:var(--font-body); font-weight:700; font-size:11px;
    padding:7px 10px; border-radius:7px; border:none; cursor:pointer;
    background:var(--bg-deep); color:var(--cyan); border:1px solid var(--line) !important;
    white-space:nowrap;
  }
  .cheat-upgrade-row button:hover{ border-color:var(--cyan) !important; }

  /* ============================================================
     MOBILE / SMALL SCREENS
     ============================================================ */
  @media (max-width: 700px){
    #topbar{ padding:8px 10px; }
    #logo{ font-size:14px; }
    #logo span{ font-size:9px; letter-spacing:2px; }
    #money-wrap{ padding:6px 10px; gap:6px; }
    #money-label{ font-size:9px; }
    #money{ font-size:15px; min-width:80px; }
    #sidebar-toggle{ font-size:10px; padding:8px 10px; letter-spacing:0; }

    #stage{ height:calc(100vh - 50px); padding:6px; }

    /* controls move from a left-side floating panel to a compact bar
       pinned along the bottom, so they never cover a narrow board */
    #controls{
      left:50%; top:auto; bottom:8px;
      transform:translateX(-50%);
      flex-direction:row; align-items:center;
      padding:8px 10px; gap:8px;
      width:calc(100% - 16px);
      max-width:480px;
    }
    #drop-btn{ font-size:12px; padding:10px 12px; flex:1; }
    #drop-cost{ font-size:10px; }
    #autodrop-btn{ font-size:9px; padding:8px 10px; flex:0 0 auto; }
    #autodrop-btn span:first-child{ display:none; } /* just show ON/OFF to save space */
    #ball-count-badge{ font-size:10px; padding:8px 8px; flex:0 0 auto; white-space:nowrap; }

    #add-cash-btn{ font-size:11px; padding:10px 14px; bottom:80px; }

    #sidebar{ width:88vw; max-width:340px; }
  }

  @media (max-width: 420px){
    #logo span{ display:none; } /* drop the tagline on very narrow phones */
    #ball-count-badge{ display:none; } /* saves space; count still shown via drop-cost area */
  }
</style>
</head>
<body>

<div id="topbar">
  <div id="logo">NEON PLINKO<span>drop &middot; bounce &middot; cash out</span></div>
  <div id="money-wrap">
    <span id="money-label">BALANCE</span>
    <span id="money">$0.00</span>
  </div>
  <button id="sidebar-toggle">⚙ UPGRADES</button>
</div>

<div id="stage">
  <div id="controls">
    <button id="drop-btn">
      DROP BALL
      <span id="drop-cost">cost: $0</span>
    </button>
    <button id="autodrop-btn">
      <span>AUTO-DROP</span>
      <span id="autodrop-status">OFF</span>
    </button>
    <div id="ball-count-badge">x1 ball / drop</div>
  </div>

  <div id="board-wrap">
    <canvas id="board" width="820" height="820"></canvas>
  </div>
</div>

<button id="add-cash-btn">
  Get a Job
</button>

<div id="sidebar-backdrop"></div>
<div id="sidebar">
  <div id="sidebar-header">
    <h2>UPGRADES</h2>
    <button id="sidebar-close">✕</button>
  </div>
  <div id="tabs">
    <button class="tab-btn active" data-tab="upgrades">Upgrades</button>
    <button class="tab-btn" data-tab="skins">Ball Skins</button>
    <button class="tab-btn" data-tab="cheats">🔒 Cheats</button>
  </div>
  <div id="sidebar-content">
    <div id="panel-upgrades" class="panel active"></div>
    <div id="panel-skins" class="panel"></div>
    <div id="panel-cheats" class="panel"></div>
  </div>
</div>

<div id="cheat-modal-backdrop"></div>
<div id="cheat-modal">
  <h3>🔒 Cheat Access</h3>
  <p>Enter the password to unlock cheats.</p>
  <input type="password" id="cheat-password-input" placeholder="Password" autocomplete="off">
  <div id="cheat-modal-error"></div>
  <div id="cheat-modal-buttons">
    <button id="cheat-cancel-btn">Cancel</button>
    <button id="cheat-submit-btn">Unlock</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
/* ================================================================================
   CONFIGURATION
   ================================================================================ */

const CONFIG = {
  BOARD_WIDTH: 1000,         
  BOARD_HEIGHT: 820,        
  PEG_SIZE: 5,            
  BALL_SIZE: 9,             
  STARTING_MONEY: 5000,      
  BASE_BALL_COST: 10,       
  MIN_BALL_COST: 1,         
  BASE_PEG_ROWS: 14,        
  SPAWN_BASE_WIDTH_ROWS: 3,   
  SPAWN_MAX_WIDTH_ROWS: 10,   
  DROP_COOLDOWN_TIME: 1.0,    

  MULTIPLIER_SETS: {
    8:  [8, 3, 1.5, 1, 0.1, 1, 1.5, 3, 8],
    9:  [10, 4, 2, 1.4, 0.6, 0.6, 1.4, 2, 4, 10],
    10: [15, 6, 3, 1.5, 1, 0.4, 1, 1.5, 3, 6, 15],
    11: [20, 8, 4, 2, 1.2, 0.5, 0.5, 1.2, 2, 4, 8, 20],
    12: [25, 10, 5, 3, 1.5, 0.7, 0.3, 0.7, 1.5, 3, 5, 10, 25],
    14: [25, 10, 5, 2, 1, 0.5, 0.25, 0.1, 0.25, 0.5, 1, 2, 5, 10, 25],
  },

  UPGRADES: [
    {
      id: "moneyMult",
      icon: "💰",
      name: "Money Multiplier",
      description: "Boosts profitable payout multipliers (>1x). Goes up by +0.1 per purchase, no limit.",
      type: "multiplier_bonus",
      bonusPerLevel: 0.10,
      baseCost: 100,
      growth: 1.5,
      maxLevel: Infinity,
      effectText: (lvl) => `+${(lvl * 0.1).toFixed(1)}x bonus to profitable bins (>1x)`,
    },
    {
      id: "multiball",
      icon: "🔴",
      name: "Multi-Ball",
      description: "Drop extra balls at the same time with every click.",
      type: "multiball",
      baseCost: 75,
      growth: 1.5,
      maxLevel: Infinity,
      effectText: (lvl) => `${1 + lvl} balls per drop`,
    },
    {
      id: "discount",
      icon: "🏷️",
      name: "Bargain Bin",
      description: "Reduces the cost of every ball drop by a flat $0.10 per level. Stops once ball drops hit the $1 floor.",
      type: "discount",
      discountPerLevel: 0.1,
      baseCost: 25,
      growth: 1.5,
      maxLevel: Math.round((10 - 1) / 0.1),
      effectText: (lvl) => `-$${(lvl * 0.1).toFixed(2)} per ball drop`,
    },
    {
      id: "spawnWidth",
      icon: "🎯",
      name: "Wider Spawner",
      description: "Widens the drop zone at the top of the board so balls can start further from center.",
      type: "spawn_width",
      amountPerLevel: 1,
      baseCost: 10,
      growth: 1.5,
      maxLevel: 7,
      effectText: (lvl) => `drop zone spans ~${3 + lvl} pegs wide`,
    },
    {
      id: "cooldown",
      icon: "⚡",
      name: "Rapid Drop",
      description: "Decreases drop cooldown time by 0.1 seconds per level.",
      type: "cooldown",
      reductionPerLevel: 0.1,
      baseCost: 50,
      growth: 1.5,
      maxLevel: 10,
      effectText: (lvl) => `-${(lvl * 0.1).toFixed(1)}s drop cooldown`,
    },
  ],

  BALL_SKINS: [
    { id: "classic", name: "Classic Gold", cost: 0,   color: "#FFC145", glow: false },
    { id: "pink",    name: "Neon Pink",    cost: 100, color: "#FF2E88", glow: true  },
    { id: "cyan",    name: "Cyber Cyan",   cost: 150, color: "#29F1E0", glow: true  },
    { id: "galaxy",  name: "Galaxy",       cost: 300, color: "#9B5CFF", glow: true  },
    { id: "diamond", name: "Diamond",      cost: 500, color: "#E8FBFF", glow: true  },
  ],
};

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const stageEl = document.getElementById("stage");
const controlsEl = document.getElementById("controls");

let W, H;
let TOP_MARGIN, BIN_HEIGHT, PLAY_H;
let PEG_R = CONFIG.PEG_SIZE, BALL_R = CONFIG.BALL_SIZE;

const SIM_SPEED       = 0.55;
const GRAVITY_Y        = 0.75;
const BALL_BOUNCINESS  = 0.8;
const BALL_FRICTION_AIR = 0.012;
const BALL_DENSITY     = 0.05;
const PEG_RESTITUTION  = 0.5;
const WALL_RESTITUTION = 0.35;
const FLOOR_RESTITUTION = 0.1;

const { Engine, World, Bodies, Body, Composite } = Matter;
const engine = Engine.create();
engine.world.gravity.y = GRAVITY_Y;
engine.world.gravity.scale = 0.001;

let state = {
  money: CONFIG.STARTING_MONEY,
  upgradeLevels: {},
  ownedSkins: new Set([CONFIG.BALL_SKINS[0].id]),
  currentSkin: CONFIG.BALL_SKINS[0].id,
  rows: CONFIG.BASE_PEG_ROWS,
  lastDropTime: 0,
  autoDrop: false,
};
CONFIG.UPGRADES.forEach(u => state.upgradeLevels[u.id] = 0);

let pegBodies = [];
let bins = [];
let balls = [];
let floaters = [];
let BOARD_GAP = 0;
let addCashTimer = null;

/* ================================================================================
   AUDIO SETUP & COLLISIONS (.wav configured)
   ================================================================================
   Uses the Web Audio API instead of <audio> elements. Cloning an <audio>
   element (the old approach) spins up a brand-new decoder per play, and
   browsers cap how many can run at once — with Multi-Ball + Rapid Drop
   firing dozens of peg hits per second, that cap gets hit fast and the
   browser just stops playing anything. Web Audio decodes the sound ONCE
   into memory and can then play it many times simultaneously for almost
   no extra cost, which is what a fast bounce sound actually needs.
   ================================================================================ */

// Bump this number any time you replace the bounce.wav file with a new
// version — browsers and GitHub's CDN cache audio files aggressively by
// filename, so just re-uploading a file with the same name isn't enough to
// make people actually hear the new one. Changing this forces a fresh fetch.
const SOUND_VERSION = 4;
const BOUNCE_SOUND_VOLUME = 0.3;

// Hard cap on how many bounce sounds can play at the exact same instant.
// Without this, a huge multi-ball pile-up could still spam so many voices
// at once that it turns into a wall of noise / crackling. Raise or lower
// to taste — this is NOT the same limit that was silencing the sound
// before (that was a browser limit on <audio> elements specifically).
const MAX_CONCURRENT_BOUNCE_SOUNDS = 12;

const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
let bounceBuffer = null;
let activeBounceVoices = 0;

if(audioCtx){
  fetch(`Sounds/bounce.wav?v=${SOUND_VERSION}`)
    .then(res => {
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.arrayBuffer();
    })
    .then(data => audioCtx.decodeAudioData(data))
    .then(buffer => { bounceBuffer = buffer; })
    .catch(err => {
      console.warn("Bounce sound failed to load — check that Sounds/bounce.wav exists, the filename/case matches exactly, and it loaded without a 404:", err);
    });
}

function playBounceSound(){
  if(!audioCtx || !bounceBuffer) return;
  if(activeBounceVoices >= MAX_CONCURRENT_BOUNCE_SOUNDS) return; // throttle under heavy load

  // Most browsers start an AudioContext "suspended" until a user gesture —
  // dropping a ball counts as one, so resume here just in case.
  if(audioCtx.state === "suspended") audioCtx.resume();

  const source = audioCtx.createBufferSource();
  source.buffer = bounceBuffer;
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = BOUNCE_SOUND_VOLUME;
  source.connect(gainNode).connect(audioCtx.destination);

  activeBounceVoices++;
  source.onended = () => { activeBounceVoices--; };
  source.start(0);
}

Matter.Events.on(engine, 'collisionStart', (event) => {
  let playSound = false;

  for (let pair of event.pairs) {
    const labelA = pair.bodyA.label;
    const labelB = pair.bodyB.label;

    if (
      (labelA === 'ball' && (labelB === 'peg' || labelB === 'ball')) ||
      (labelB === 'ball' && (labelA === 'peg' || labelA === 'ball'))
    ) {
      playSound = true;
      break;
    }
  }

  if (playSound) {
    playBounceSound();
  }
});


function getUpgrade(id){ return CONFIG.UPGRADES.find(u => u.id === id); }
function getLevel(id){ return state.upgradeLevels[id] || 0; }

function getMultiplierBonus(){
  let bonus = 0;
  CONFIG.UPGRADES.forEach(u => {
    if(u.type === "multiplier_bonus"){
      bonus += getLevel(u.id) * u.bonusPerLevel;
    }
  });
  return bonus;
}
function getBallCount(){
  let count = 1;
  CONFIG.UPGRADES.forEach(u => {
    if(u.type === "multiball") count += getLevel(u.id);
  });
  return count;
}
function getSpawnWidthRows(){
  let width = CONFIG.SPAWN_BASE_WIDTH_ROWS;
  CONFIG.UPGRADES.forEach(u => {
    if(u.type === "spawn_width") width += getLevel(u.id) * u.amountPerLevel;
  });
  return Math.min(width, CONFIG.SPAWN_MAX_WIDTH_ROWS);
}
function getSpawnWidthPx(){
  return (getSpawnWidthRows() - 1) * BOARD_GAP;
}
function getBallCost(){
  const discountLevel = getLevel("discount");
  const discountUpgrade = getUpgrade("discount");
  const discount = discountUpgrade ? discountLevel * discountUpgrade.discountPerLevel : 0;
  return Math.max(CONFIG.MIN_BALL_COST, Math.round((CONFIG.BASE_BALL_COST - discount) * 100) / 100);
}
function getTotalBallCost(){ return getBallCost(); }
function getCooldownTime(){
  const cdLevel = getLevel("cooldown");
  const cdUpgrade = getUpgrade("cooldown");
  const reduction = cdUpgrade ? cdLevel * cdUpgrade.reductionPerLevel : 0;
  return Math.max(0.1, Math.round((CONFIG.DROP_COOLDOWN_TIME - reduction) * 100) / 100);
}
function getRows(){ return CONFIG.BASE_PEG_ROWS; }
function upgradeCost(u){
  const lvl = getLevel(u.id);
  return Math.round(u.baseCost * Math.pow(u.growth, lvl));
}
function currentSkin(){
  return CONFIG.BALL_SKINS.find(s => s.id === state.currentSkin) || CONFIG.BALL_SKINS[0];
}

function buildBoard(){
  const rows = getRows();
  state.rows = rows;
  const binCount = rows + 1;
  const gap = W / binCount;
  BOARD_GAP = gap;
  const binsY = TOP_MARGIN + PLAY_H;

  const scaleFactor = W / CONFIG.BOARD_WIDTH;
  PEG_R = Math.max(1, CONFIG.PEG_SIZE * scaleFactor);
  BALL_R = Math.max(3, CONFIG.BALL_SIZE * scaleFactor);

  Composite.clear(engine.world, false);
  pegBodies = [];
  // Composite.clear() above just wiped every physics body from the world,
  // including any balls currently mid-air — without clearing these arrays
  // too, their JS objects would keep rendering as frozen "ghost" circles
  // forever, since their underlying physics body no longer exists.
  balls = [];
  floaters = [];

  const rowGapY = PLAY_H / (rows + 1);
  for(let i = 0; i < rows; i++){
    const pegCount = i + 1;
    const rowY = TOP_MARGIN + (i + 1) * rowGapY;
    const startX = W / 2 - (i * gap) / 2;
    for(let j = 0; j < pegCount; j++){
      const peg = Bodies.circle(startX + j * gap, rowY, PEG_R, {
        isStatic: true, restitution: PEG_RESTITUTION, friction: 0.05, label: "peg",
      });
      pegBodies.push(peg);
    }
  }

  const wallOpts = { isStatic: true, restitution: WALL_RESTITUTION, friction: 0, label: "wall" };
  const leftWall  = Bodies.rectangle(-10, H / 2, 20, H * 2, wallOpts);
  const rightWall = Bodies.rectangle(W + 10, H / 2, 20, H * 2, wallOpts);

  const dividers = [];
  for(let i = 1; i < binCount; i++){
    dividers.push(Bodies.rectangle(i * gap, binsY + BIN_HEIGHT / 2, 4, BIN_HEIGHT, {
      isStatic: true, restitution: WALL_RESTITUTION, friction: 0.4, label: "divider",
    }));
  }

  const floor = Bodies.rectangle(W / 2, H + 8, W * 2, 20, {
    isStatic: true, restitution: FLOOR_RESTITUTION, friction: 0.8, label: "floor",
  });

  Composite.add(engine.world, [...pegBodies, leftWall, rightWall, ...dividers, floor]);

  const multipliers = CONFIG.MULTIPLIER_SETS[rows] || CONFIG.MULTIPLIER_SETS[CONFIG.BASE_PEG_ROWS];
  bins = [];
  for(let i = 0; i < binCount; i++){
    bins.push({
      x1: i * gap,
      x2: (i + 1) * gap,
      base: multipliers[i] !== undefined ? multipliers[i] : 1,
    });
  }
}

function resizeCanvas(){
  // On mobile (see the @media rule above) the controls panel becomes a
  // horizontal bar pinned to the bottom of the screen instead of a
  // floating overlay on the left — it's still position:absolute, so it
  // doesn't reduce the stage's layout height automatically. We have to
  // account for its height ourselves or the board would render underneath it.
  const isMobileLayout = window.innerWidth <= 700;
  const controlsSpace = isMobileLayout ? controlsEl.offsetHeight + 20 : 0;

  const availH = stageEl.clientHeight - 16 - controlsSpace;
  const availW = stageEl.clientWidth - 16;
  let newW = CONFIG.BOARD_WIDTH;
  let newH = CONFIG.BOARD_HEIGHT;
  const scale = Math.min(1, availW / newW, availH / newH);

  newW = Math.floor(newW * scale);
  newH = Math.floor(newH * scale);

  canvas.width = newW;
  canvas.height = newH;
  canvas.style.width = newW + "px";
  canvas.style.height = newH + "px";
  W = newW;
  H = newH;

  const binCount = CONFIG.BASE_PEG_ROWS + 1;
  const binGap = W / binCount;
  BIN_HEIGHT = Math.max(36, Math.min(binGap, H * 0.28));
  TOP_MARGIN = Math.max(60, Math.round(H * 0.14));
  PLAY_H = H - TOP_MARGIN - BIN_HEIGHT;

  buildBoard();
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", resizeCanvas);

/* ================================================================================
   CONTROLS & BUTTONS
   ================================================================================ */
const dropBtn = document.getElementById("drop-btn");
const autoDropBtn = document.getElementById("autodrop-btn");
const autoDropStatus = document.getElementById("autodrop-status");
const addCashBtn = document.getElementById("add-cash-btn");
const dropCostLabel = document.getElementById("drop-cost");
const ballCountBadge = document.getElementById("ball-count-badge");

function triggerDrop() {
  const now = Date.now() / 1000;
  if(now - state.lastDropTime < getCooldownTime()) return;

  const cost = getBallCost();
  const count = getBallCount();
  const totalCost = getTotalBallCost();
  if(state.money < totalCost) {
    if(state.autoDrop) {
      state.autoDrop = false;
      autoDropBtn.classList.remove("active");
      autoDropStatus.textContent = "OFF";
    }
    return;
  }

  state.lastDropTime = now;
  state.money = Math.round((state.money - totalCost) * 100) / 100;

  const skin = currentSkin();
  const spawnWidth = getSpawnWidthPx();
  for(let i = 0; i < count; i++){
    const startX = W / 2 + (Math.random() - 0.5) * spawnWidth + (i - (count - 1) / 2) * 4;
    const body = Bodies.circle(startX, TOP_MARGIN * 0.4, BALL_R, {
      restitution: BALL_BOUNCINESS,
      friction: 0.02,
      frictionAir: BALL_FRICTION_AIR,
      density: BALL_DENSITY,
      label: "ball",
    });
    Body.setVelocity(body, { x: (Math.random() - 0.5) * 1.2, y: 0 });
    Composite.add(engine.world, body);

    balls.push({
      body,
      color: skin.color,
      glow: skin.glow,
      paid: false,
      removeTimer: 45,
      costPerBall: cost
    });
  }
  updateHUD();
}

dropBtn.addEventListener("click", triggerDrop);

autoDropBtn.addEventListener("click", () => {
  state.autoDrop = !state.autoDrop;
  if(state.autoDrop) {
    autoDropBtn.classList.add("active");
    autoDropStatus.textContent = "ON";
  } else {
    autoDropBtn.classList.remove("active");
    autoDropStatus.textContent = "OFF";
  }
});

addCashBtn.addEventListener("click", () => {
  state.money = Math.round((state.money + 1000) * 100) / 100;
  updateHUD();
});

/* ================================================================================
   PHYSICS STEP
   ================================================================================ */
function stepPhysics(){
  Engine.update(engine, (1000 / 60) * SIM_SPEED);

  if(state.autoDrop) {
    const now = Date.now() / 1000;
    if(now - state.lastDropTime >= getCooldownTime()) {
      triggerDrop();
    }
  }

  const binsY = TOP_MARGIN + PLAY_H;
  for(let i = balls.length - 1; i >= 0; i--){
    const b = balls[i];
    if(!b.paid && b.body.position.y + BALL_R >= binsY){
      settleBall(b);
    }
    if(b.paid){
      b.removeTimer--;
      if(b.removeTimer <= 0){
        Composite.remove(engine.world, b.body);
        balls.splice(i, 1);
      }
    }
  }

  for(let i = floaters.length - 1; i >= 0; i--){
    const f = floaters[i];
    f.y -= 0.8;
    f.life -= 1;
    if(f.life <= 0) floaters.splice(i, 1);
  }
}

function getBinLabel(base) {
  return `${base}x`;
}

function settleBall(b){
  b.paid = true;
  const x = b.body.position.x;
  const binIndex = Math.min(bins.length - 1, Math.max(0, Math.floor(x / (W / bins.length))));
  const bin = bins[binIndex];
  
  const ballCost = b.costPerBall;
  const bonus = bin.base > 1 ? getMultiplierBonus() : 0;
  const finalMultiplier = bin.base * (1 + bonus);
  
  const returnAmount = Math.round(ballCost * finalMultiplier * 100) / 100;
  state.money = Math.round((state.money + returnAmount) * 100) / 100;
  const netChange = Math.round((returnAmount - ballCost) * 100) / 100;
  const displaySub = `${finalMultiplier.toFixed(2)}x`;

  updateHUD();

  let labelText = "";
  let labelColor = "#57F29A";

  if (netChange > 0) {
    labelText = `+$${netChange.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    labelColor = "#57F29A";
  } else if (netChange < 0) {
    labelText = `-$${Math.abs(netChange).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    labelColor = "#FF5C5C";
  } else {
    labelText = "$0.00";
    labelColor = "#9C8FBD";
  }

  floaters.push({
    x: (bin.x1 + bin.x2) / 2,
    y: TOP_MARGIN + PLAY_H - 10,
    text: labelText,
    sub: displaySub,
    life: 55,
    color: labelColor,
  });

  bin._flash = 18;
}

/* ================================================================================
   RENDERING
   ================================================================================ */
function draw(){
  ctx.clearRect(0, 0, W, H);

  const spawnWidth = getSpawnWidthPx();
  const spawnX1 = W / 2 - spawnWidth / 2;
  const spawnY1 = 16;
  const spawnY2 = TOP_MARGIN - 18;
  ctx.save();
  ctx.strokeStyle = "rgba(41,241,224,0.35)";
  ctx.fillStyle = "rgba(41,241,224,0.06)";
  ctx.setLineDash([5, 4]);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(spawnX1, spawnY1, spawnWidth, spawnY2 - spawnY1, 8)
                : ctx.rect(spawnX1, spawnY1, spawnWidth, spawnY2 - spawnY1);
  ctx.fill();
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "rgba(41,241,224,0.55)";
  ctx.font = "10px " + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "center";
  ctx.fillText("DROP ZONE", W / 2, spawnY1 + (spawnY2 - spawnY1) / 2 + 3);
  ctx.restore();

  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.beginPath();
  ctx.moveTo(0, TOP_MARGIN); ctx.lineTo(W, TOP_MARGIN);
  ctx.stroke();

  for(const peg of pegBodies){
    ctx.beginPath();
    ctx.arc(peg.position.x, peg.position.y, PEG_R, 0, Math.PI*2);
    ctx.fillStyle = "#4a3d6b";
    ctx.shadowColor = "rgba(155,92,255,0.4)";
    ctx.shadowBlur = 6;
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  const binsY = TOP_MARGIN + PLAY_H;
  bins.forEach((bin, i) => {
    const hot = bin.base >= 5 ? 1 : bin.base > 1 ? 0.55 : 0.25;
    const flash = bin._flash > 0 ? bin._flash / 18 : 0;
    if(bin._flash > 0) bin._flash--;

    const grad = ctx.createLinearGradient(0, binsY, 0, H);
    const baseColor = `rgba(255, ${Math.round(46 + (1-hot)*140)}, ${Math.round(136 - hot*80)}, ${0.25 + hot*0.35 + flash*0.4})`;
    grad.addColorStop(0, baseColor);
    grad.addColorStop(1, "rgba(10,6,18,0.05)");
    ctx.fillStyle = grad;
    ctx.fillRect(bin.x1 + 2, binsY, (bin.x2 - bin.x1) - 4, BIN_HEIGHT);

    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.moveTo(bin.x1, binsY); ctx.lineTo(bin.x1, H);
    ctx.stroke();

    ctx.fillStyle = bin.base >= 5 ? "#FFD97A" : "#E9E1FA";
    ctx.font = "bold 11px " + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = "center";
    ctx.fillText(getBinLabel(bin.base), (bin.x1 + bin.x2) / 2, binsY + BIN_HEIGHT/2 + 5);
  });
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.beginPath(); ctx.moveTo(W, binsY); ctx.lineTo(W, H); ctx.stroke();

  for(const b of balls){
    const pos = b.body.position;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, BALL_R, 0, Math.PI*2);
    ctx.fillStyle = b.color;
    if(b.glow){
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 18;
    } else {
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = 4;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.textAlign = "center";
  for(const f of floaters){
    const alpha = Math.min(1, f.life / 30);
    ctx.globalAlpha = alpha;
    ctx.font = "bold 16px " + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.font = "11px " + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillText(f.sub, f.x, f.y + 14);
    ctx.globalAlpha = 1;
  }
}

function loop(){
  stepPhysics();
  draw();
  requestAnimationFrame(loop);
}
loop();

/* ================================================================================
   HUD / SIDEBAR
   ================================================================================ */
const moneyEl = document.getElementById("money");

function updateHUD(){
  moneyEl.textContent = "$" + state.money.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const cost = getBallCost();
  const count = getBallCount();
  const totalCost = getTotalBallCost();
  dropCostLabel.textContent = `cost: $${totalCost.toFixed(2)}`;
  ballCountBadge.textContent = `x${count} ball${count > 1 ? "s" : ""} / drop`;
  
  const now = Date.now() / 1000;
  const onCooldown = (now - state.lastDropTime) < getCooldownTime();
  dropBtn.disabled = state.money < totalCost || onCooldown;

  if (state.money < totalCost) {
    if (!addCashTimer && addCashBtn.style.display !== "block") {
      addCashTimer = setTimeout(() => {
        addCashBtn.style.display = "block";
        addCashTimer = null;
      }, 3000);
    }
  } else {
    if (addCashTimer) {
      clearTimeout(addCashTimer);
      addCashTimer = null;
    }
    addCashBtn.style.display = "none";
  }

  if (sidebar.classList.contains("open")) {
    updateUpgradeButtonsState();
    updateSkinButtonsState();
  }
}

setInterval(() => {
  if (state.lastDropTime > 0) {
    updateHUD();
  }
}, 100);

function renderUpgrades(){
  const panel = document.getElementById("panel-upgrades");
  panel.innerHTML = "";
  CONFIG.UPGRADES.forEach(u => {
    const level = getLevel(u.id);
    const maxed = level >= u.maxLevel;
    const cost = upgradeCost(u);
    const affordable = state.money >= cost;

    const card = document.createElement("div");
    card.className = "card";
    card.dataset.upgradeId = u.id;
    card.innerHTML = `
      <div class="card-top">
        <span class="card-icon">${u.icon}</span>
        <span class="card-name">${u.name}</span>
      </div>
      <div class="card-desc">${u.description}</div>
      <div class="card-bottom">
        <span class="card-effect">${level > 0 ? u.effectText(level) : "no effect yet"}</span>
        <button class="buy-btn ${maxed ? "maxed" : ""}" ${maxed || !affordable ? "disabled" : ""}>
          ${maxed ? "MAXED" : "$" + cost}
        </button>
      </div>
    `;
    if(!maxed){
      card.querySelector(".buy-btn").addEventListener("click", () => buyUpgrade(u));
    }
    panel.appendChild(card);
  });
}

function updateUpgradeButtonsState(){
  CONFIG.UPGRADES.forEach(u => {
    const card = document.querySelector(`#panel-upgrades [data-upgrade-id="${u.id}"]`);
    if(!card) return;
    const level = getLevel(u.id);
    const maxed = level >= u.maxLevel;
    const cost = upgradeCost(u);
    const affordable = state.money >= cost;

    const effectSpan = card.querySelector(".card-effect");
    effectSpan.textContent = level > 0 ? u.effectText(level) : "no effect yet";

    const btn = card.querySelector(".buy-btn");
    btn.textContent = maxed ? "MAXED" : "$" + cost;
    btn.disabled = maxed || !affordable;
    if(maxed) btn.classList.add("maxed");
  });
}

function renderSkins(){
  const panel = document.getElementById("panel-skins");
  panel.innerHTML = "";
  CONFIG.BALL_SKINS.forEach(s => {
    const owned = state.ownedSkins.has(s.id);
    const equipped = state.currentSkin === s.id;
    const affordable = state.money >= s.cost;

    const card = document.createElement("div");
    card.className = "card";
    card.dataset.skinId = s.id;
    card.innerHTML = `
      <div class="skin-row">
        <div class="skin-swatch" style="background:${s.color}; box-shadow:0 0 ${s.glow ? 16 : 6}px ${s.color};"></div>
        <div class="skin-info">
          <div class="skin-name">${s.name}</div>
          <div class="skin-price">${s.cost === 0 ? "starter skin" : "$" + s.cost}</div>
        </div>
        <button class="buy-btn ${equipped ? "equipped" : ""}" ${equipped ? "disabled" : (!owned && !affordable ? "disabled" : "")}>
          ${equipped ? "EQUIPPED" : owned ? "EQUIP" : "$" + s.cost}
        </button>
      </div>
    `;
    const btn = card.querySelector(".buy-btn");
    if(!equipped){
      btn.addEventListener("click", () => buySkin(s));
    }
    panel.appendChild(card);
  });
}

function updateSkinButtonsState(){
  CONFIG.BALL_SKINS.forEach(s => {
    const card = document.querySelector(`#panel-skins [data-skin-id="${s.id}"]`);
    if(!card) return;
    const owned = state.ownedSkins.has(s.id);
    const equipped = state.currentSkin === s.id;
    const affordable = state.money >= s.cost;

    const btn = card.querySelector(".buy-btn");
    btn.textContent = equipped ? "EQUIPPED" : owned ? "EQUIP" : "$" + s.cost;
    btn.disabled = equipped || (!owned && !affordable);
    if(equipped) {
      btn.classList.add("equipped");
    } else {
      btn.classList.remove("equipped");
    }
  });
}

function buyUpgrade(u){
  const level = getLevel(u.id);
  if(level >= u.maxLevel) return;
  const cost = upgradeCost(u);
  if(state.money < cost) return;
  state.money = Math.round((state.money - cost) * 100) / 100;
  state.upgradeLevels[u.id] = level + 1;

  renderUpgrades();
  updateHUD();
}

function buySkin(s){
  if(state.ownedSkins.has(s.id)){
    state.currentSkin = s.id;
  } else {
    if(state.money < s.cost) return;
    state.money = Math.round((state.money - s.cost) * 100) / 100;
    state.ownedSkins.add(s.id);
    state.currentSkin = s.id;
  }
  renderSkins();
  updateHUD();
}

const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("sidebar-backdrop");
document.getElementById("sidebar-toggle").addEventListener("click", () => {
  sidebar.classList.add("open");
  backdrop.classList.add("open");
  renderUpgrades();
  renderSkins();
  renderCheats();
});
document.getElementById("sidebar-close").addEventListener("click", closeSidebar);
backdrop.addEventListener("click", closeSidebar);
function closeSidebar(){
  sidebar.classList.remove("open");
  backdrop.classList.remove("open");
}

/* ================================================================================
   CHEAT MENU
   ----------------------------------------------------------------------
   Change this password to whatever you want — it's just a plain string
   check, not real security (anyone could read it in the page source),
   it's just meant to keep casual players from stumbling into it.
   ================================================================================ */
const CHEAT_PASSWORD = "plinko";

let cheatUnlocked = false;

const cheatModalBackdrop = document.getElementById("cheat-modal-backdrop");
const cheatModal = document.getElementById("cheat-modal");
const cheatPasswordInput = document.getElementById("cheat-password-input");
const cheatModalError = document.getElementById("cheat-modal-error");
const cheatsTabBtn = document.querySelector('.tab-btn[data-tab="cheats"]');

function openCheatModal(){
  cheatModalBackdrop.classList.add("open");
  cheatModal.classList.add("open");
  cheatModalError.textContent = "";
  cheatPasswordInput.value = "";
  cheatPasswordInput.focus();
}
function closeCheatModal(){
  cheatModalBackdrop.classList.remove("open");
  cheatModal.classList.remove("open");
}

function trySubmitCheatPassword(){
  if(cheatPasswordInput.value === CHEAT_PASSWORD){
    cheatUnlocked = true;
    cheatsTabBtn.textContent = "🔓 Cheats";
    closeCheatModal();
    switchToTab("cheats");
  } else {
    cheatModalError.textContent = "Incorrect password.";
    cheatPasswordInput.value = "";
    cheatPasswordInput.focus();
  }
}

document.getElementById("cheat-submit-btn").addEventListener("click", trySubmitCheatPassword);
document.getElementById("cheat-cancel-btn").addEventListener("click", closeCheatModal);
cheatModalBackdrop.addEventListener("click", closeCheatModal);
cheatPasswordInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") trySubmitCheatPassword();
  if(e.key === "Escape") closeCheatModal();
});

function cheatAddMoney(amount){
  if(!amount || amount <= 0) return;
  state.money = Math.round((state.money + amount) * 100) / 100;
  updateHUD();
}

function cheatMaxUpgrade(u){
  state.upgradeLevels[u.id] = (u.maxLevel === Infinity) ? 999 : u.maxLevel;
  updateHUD();
  renderCheats();
}

function cheatAddUpgradeLevel(u){
  const level = getLevel(u.id);
  if(level < u.maxLevel) state.upgradeLevels[u.id] = level + 1;
  updateHUD();
  renderCheats();
}

function cheatMaxAllUpgrades(){
  CONFIG.UPGRADES.forEach(u => {
    state.upgradeLevels[u.id] = (u.maxLevel === Infinity) ? 999 : u.maxLevel;
  });
  updateHUD();
  renderCheats();
}

function cheatUnlockAllSkins(){
  CONFIG.BALL_SKINS.forEach(s => state.ownedSkins.add(s.id));
  updateHUD();
  renderCheats();
}

function renderCheats(){
  const panel = document.getElementById("panel-cheats");

  if(!cheatUnlocked){
    panel.innerHTML = `<div class="cheat-locked-msg">🔒 Locked.<br>Click this tab to enter the password.</div>`;
    return;
  }

  panel.innerHTML = `
    <div class="cheat-section-title">💵 MONEY</div>
    <div class="cheat-money-row">
      <input type="number" id="cheat-money-amount" placeholder="Amount" min="0" step="1">
      <button id="cheat-add-money-btn">Add</button>
    </div>
    <div class="cheat-quick-buttons">
      <button data-amount="1000">+$1,000</button>
      <button data-amount="10000">+$10,000</button>
      <button data-amount="100000">+$100,000</button>
      <button data-amount="1000000">+$1,000,000</button>
    </div>

    <div class="cheat-section-title">⬆️ UPGRADES (FREE)</div>
    <div style="margin-bottom:10px;">
      <button id="cheat-max-all-btn" style="width:100%; font-family:var(--font-body); font-weight:700; font-size:12.5px; padding:10px; border-radius:8px; border:none; cursor:pointer; background:linear-gradient(180deg, var(--gold), #e8971f); color:#1a0e08;">MAX ALL UPGRADES</button>
    </div>
    <div id="cheat-upgrade-list"></div>

    <div class="cheat-section-title" style="margin-top:16px;">🎨 SKINS</div>
    <button id="cheat-unlock-skins-btn" style="width:100%; font-family:var(--font-body); font-weight:700; font-size:12.5px; padding:10px; border-radius:8px; border:none; cursor:pointer; background:linear-gradient(180deg, var(--pink), #c11762); color:white;">UNLOCK ALL SKINS</button>
  `;

  document.getElementById("cheat-add-money-btn").addEventListener("click", () => {
    const input = document.getElementById("cheat-money-amount");
    cheatAddMoney(parseFloat(input.value));
    input.value = "";
  });
  panel.querySelectorAll(".cheat-quick-buttons button").forEach(btn => {
    btn.addEventListener("click", () => cheatAddMoney(parseFloat(btn.dataset.amount)));
  });
  document.getElementById("cheat-max-all-btn").addEventListener("click", cheatMaxAllUpgrades);
  document.getElementById("cheat-unlock-skins-btn").addEventListener("click", cheatUnlockAllSkins);

  const list = document.getElementById("cheat-upgrade-list");
  CONFIG.UPGRADES.forEach(u => {
    const level = getLevel(u.id);
    const maxLabel = u.maxLevel === Infinity ? "∞" : u.maxLevel;
    const row = document.createElement("div");
    row.className = "cheat-upgrade-row";
    row.innerHTML = `
      <span class="cheat-upgrade-name">${u.icon} ${u.name}</span>
      <span class="cheat-upgrade-level">Lv ${level}/${maxLabel}</span>
      <button data-action="add">+1</button>
      <button data-action="max">MAX</button>
    `;
    row.querySelector('[data-action="add"]').addEventListener("click", () => cheatAddUpgradeLevel(u));
    row.querySelector('[data-action="max"]').addEventListener("click", () => cheatMaxUpgrade(u));
    list.appendChild(row);
  });
}

function switchToTab(tabName){
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelector(`.tab-btn[data-tab="${tabName}"]`).classList.add("active");
  document.getElementById("panel-" + tabName).classList.add("active");
  if(tabName === "cheats") renderCheats();
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if(btn.dataset.tab === "cheats" && !cheatUnlocked){
      openCheatModal();
      return;
    }
    switchToTab(btn.dataset.tab);
  });
});

updateHUD();
</script>
</body>
</html>
